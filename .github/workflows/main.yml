
name: Build Windows Geode

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: geode
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          target: Win64

      - name: Diagnose binding errors
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== GEODE BINDINGS DIAGNOSTICS ==="

          $roots = @(
            "bindings-repo/bindings/2.2081",
            "build/_deps/bindings-src/bindings/2.2081",
            "build/bindings/bindings/Geode",
            "geode-sdk-clone/loader/include",
            "cpm-cache/tuliphook"
          )

          foreach ($root in $roots) {
            if (-not (Test-Path $root)) {
              Write-Host "Not found: $root"
              continue
            }

            Write-Host "=== Searching $root ==="

            $files = Get-ChildItem $root -Recurse -File |
              Where-Object {
                $_.Extension -in @(".bro", ".hpp", ".h", ".cpp")
              }

            foreach ($type in @(
              "SequenceTriggerState",
              "EffectManagerState"
            )) {
              Write-Host "--- $type ---"

              $files |
                Select-String -Pattern $type -SimpleMatch |
                Select-Object -First 20 |
                ForEach-Object {
                  Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)"
                }
            }
          }

          Write-Host "=== DIAGNOSTICS COMPLETE ==="

      - name: Upload compiled mod
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: SafeClick-Windows-geode
          path: ${{ steps.geode.outputs.build-output }}
          if-no-files-found: error
